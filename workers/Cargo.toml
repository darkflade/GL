[package]
name = "gl_workers"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
tokio = { version = "1.48.0", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid"] }
uuid = { version = "1.19.0", features = ["serde", "v7", "fast-rng"] }
redis = { version = "1.0.5", features = ["tokio-comp"] }
infer = "0.19.0"
dotenv = "0.15.0"
log = "0.4.28"
fern = "0.7.1"
colored = "3.0.0"
